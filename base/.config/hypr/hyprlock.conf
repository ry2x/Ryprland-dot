# Rystal Shell lock screen
# Theme colors are generated by Matugen from the active wallpaper.
source = $HOME/.config/hypr/hyprlock/matugen/matugen-hyprlock.conf

$font_ui = Inter
$font_mono = GeistMono Nerd Font
$panel_x = 0

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = rystal, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 3, rystal
    animation = fadeOut, 1, 3, rystal
    animation = inputFieldDots, 1, 2, rystal
}

background {
    monitor =
    path = $image
    blur_size = 5
    blur_passes = 2
    noise = 0.012
    contrast = 0.92
    brightness = 0.68
    vibrancy = 0.12
    vibrancy_darkness = 0.18
}

# Clock header
label {
    monitor =
    text = <span weight="800">$TIME</span>
    color = $primary
    font_size = 86
    font_family = $font_ui
    position = $panel_x, 330
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:5000] date +"<b>%A</b>  •  %B %d, %Y"
    color = $on_surface
    font_size = 17
    font_family = $font_ui
    position = $panel_x, 265
    halign = center
    valign = center
    zindex = 2
}

# Authentication card
shape {
    monitor =
    size = 440, 340
    color = $surface_glass
    rounding = 24
    border_size = 1
    border_color = $glass_border
    shadow_passes = 3
    shadow_size = 20
    shadow_color = $scrim_shadow
    shadow_boost = 1.15
    position = $panel_x, 25
    halign = center
    valign = center
    zindex = 0
}

# Layered translucency approximates Rystal Shell's 145-degree glass gradient.
shape {
    monitor =
    size = 436, 336
    color = $surface_glass_inner
    rounding = 22
    position = $panel_x, 25
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $HOME/Profile/Profile.png
    size = 88
    rounding = -1
    border_size = 2
    border_color = $primary
    shadow_passes = 2
    shadow_size = 9
    shadow_color = $primary_glow
    position = $panel_x, 115
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = <span weight="800">@$USER</span>
    color = $primary
    font_size = 20
    font_family = $font_mono
    position = $panel_x, 53
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = Arch Linux  •  Hyprland
    color = $text_dim
    font_size = 13
    font_family = $font_ui
    position = $panel_x, 19
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 370, 54
    outline_thickness = 2
    rounding = 14
    dots_size = 0.19
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = $primary_edge
    inner_color = $primary_container_soft
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    capslock_color = $tertiary
    fade_on_empty = false
    placeholder_text = <span alpha="78%">󰌾  Enter password</span>
    check_text = <span weight="700">Authenticating…</span>
    fail_text = <span weight="700">Try again</span>  ($ATTEMPTS)
    font_family = $font_mono
    shadow_passes = 2
    shadow_size = 10
    shadow_color = $primary_glow
    shadow_boost = 1.05
    position = $panel_x, -55
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh
    color = $tertiary
    font_size = 11
    font_family = $font_mono
    position = $panel_x, -94
    halign = center
    valign = center
    zindex = 2
}

# Signature
label {
    monitor =
    text = <span weight="800">THE STARRY RIFT</span>
    color = $on_surface
    font_size = 14
    font_family = $font_mono
    position = 42, 72
    halign = left
    valign = bottom
    zindex = 2
}

label {
    monitor =
    text = The Only Neat Thing To Do
    color = $text_dim
    font_size = 10
    font_family = $font_mono
    position = 42, 48
    halign = left
    valign = bottom
    zindex = 2
}

# Local-only Caps Lock status capsule.
shape {
    monitor =
    size = 280, 72
    color = $surface_glass
    rounding = 18
    border_size = 1
    border_color = $glass_edge
    shadow_passes = 2
    shadow_size = 14
    shadow_color = $scrim_shadow
    position = -32, 42
    halign = right
    valign = bottom
    zindex = 0
}

label {
    monitor =
    text = cmd[update:250] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/check-capslock.sh --label
    color = $primary
    font_size = 14
    font_family = $font_mono
    position = -60, 65
    halign = right
    valign = bottom
    zindex = 2
}
