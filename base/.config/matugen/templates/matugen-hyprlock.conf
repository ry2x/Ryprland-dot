# Image Path
$image = {{image}}

# Rystal Shell glass surfaces and accents
$surface_glass = rgba({{colors.surface.default.hex_stripped}}4d)
$surface_glass_inner = rgba({{colors.surface.default.hex_stripped}}24)
$primary_container_soft = rgba({{colors.primary_container.default.hex_stripped}}6b)
$glass_edge = rgba({{colors.on_surface.default.hex_stripped}}21)
$glass_border = rgba({{colors.on_surface.default.hex_stripped}}2e) rgba({{colors.primary.default.hex_stripped}}24) 145deg
$primary_edge = rgba({{colors.primary.default.hex_stripped}}8f)
$primary_glow = rgba({{colors.primary.default.hex_stripped}}2e)
$scrim_shadow = rgba({{colors.scrim.default.hex_stripped}}73)
$text_dim = rgba({{colors.on_surface.default.hex_stripped}}b3)

# All Colors
<* for name, value in colors *>
${{name}} = rgba({{value.default.hex_stripped}}ff)
<* endfor *>
