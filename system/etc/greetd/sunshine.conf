# Separate host identity; never copy the desktop user's keys or state here.
sunshine_name = Ryprland Login
port = 48089
capture = wlr
output_name = RMT-LOGIN
encoder = vaapi
system_tray = disabled
upnp = disabled
origin_web_ui_allowed = pc
controller = disabled
file_apps = /etc/greetd/sunshine-apps.json
file_state = /var/lib/ryprland-login/sunshine_state.json
credentials_file = /var/lib/ryprland-login/sunshine_state.json
pkey = /var/lib/ryprland-login/credentials/cakey.pem
cert = /var/lib/ryprland-login/credentials/cacert.pem
log_path = /var/lib/ryprland-login/sunshine.log
audio_sink = login-silence
