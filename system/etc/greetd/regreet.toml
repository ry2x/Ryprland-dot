# ReGreet configuration

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
cursor_blink = true
font_name = "Adwaita Sans 16"
icon_theme_name = "breeze-dark"
theme_name = "Materia-dark"

[appearance]
greeting_msg = "Hello Master!"

[widget.clock]
format = "%a %H:%M"
resolution = "500ms"
timezone = "Asia/Tokyo"
label_width = 150

[background]
path = "/usr/share/backgrounds/greeter.png"
fit = "Cover"
